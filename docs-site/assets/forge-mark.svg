  <defs>
    <linearGradient id="forge-ring" x1="10" y1="85" x2="92" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5d18"/>
      <stop offset=".42" stop-color="#ff7a18"/>
      <stop offset=".63" stop-color="#ff9c24"/>
      <stop offset=".79" stop-color="#ffc33c"/>
      <stop offset=".9" stop-color="#ffe07a"/>
