  </defs>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#forge-ring)" stroke-width="13" stroke-linecap="round" stroke-dasharray="194 26" transform="rotate(-42 50 50)"/>
  <circle cx="82.5" cy="37" r="6.5" fill="#58b9ff"/>
